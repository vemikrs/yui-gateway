[tool.poetry]
name = "yui-gateway"
version = "0.1.0"
description = "Entra ID-based local proxy to Azure OpenAI"
authors = ["YuiGateway Team <vemikrs@users.noreply.github.com>"]
packages = [{include = "gateway"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.131.0"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
msal = "^1.34.0"
httpx = "^0.28.0"
pydantic-settings = "^2.13.1"
python-dotenv = "^1.0.0"
azure-identity = "^1.25.2"
azure-mgmt-resource = "^25.0.0"
azure-mgmt-authorization = "^4.0.0"
azure-mgmt-cognitiveservices = "^14.1.0"
azure-mgmt-subscription = "^3.1.1"
jsonschema = "^4.25.0"
prometheus-client = "^0.24.1"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.12.0"
pytest-cov = "^7.0.0"
black = "^26.1.0"
ruff = "^0.15.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--asyncio-mode=auto"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gateway"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
